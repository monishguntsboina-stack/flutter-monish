name: smart_student_assessment
description: "Smart Student Assessment Management System - Full Stack College Development Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core and Services
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

  # State Management & Utilities
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.70.2

  # UI Icons & Styling
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
